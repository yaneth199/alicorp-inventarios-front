name: Java and PostgreSQL tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigpi_test
          POSTGRES_USER: sigpi_test
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigpi_test -d sigpi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/sigpi_test
      DB_USER: sigpi_test
      DB_PASSWORD: isolated_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, unit tests and PostgreSQL integration
        run: mvn -B -ntp clean verify -Pintegration
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
