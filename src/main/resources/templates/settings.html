<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Configuración</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('settings')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Configuración del Sistema')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="report-layout"><div class="card report-menu"><a class="active">🏢 Información de la Empresa</a><a>📦 Parámetros de Inventario</a><a>♟ Configuración de Usuarios</a><a>💾 Copias de Seguridad</a><a>⚙ Datos del Sistema</a></div><div class="card"><div class="card-head"><h2>🏢 Información de la Empresa</h2></div><div class="card-body"><form th:action="@{/settings}" th:object="${setting}" method="post"><div class="form-grid"><div class="field"><label>Razón social</label><input class="input" th:field="*{businessName}"></div><div class="field"><label>RUC</label><input class="input" th:field="*{ruc}"></div><div class="field"><label>Dirección</label><input class="input" th:field="*{address}"></div><div class="field"><label>Sede</label><input class="input" th:field="*{branch}"></div><div class="field"><label>Teléfono</label><input class="input" th:field="*{phone}"></div><div class="field"><label>Correo de contacto</label><input class="input" th:field="*{email}"></div><div class="field"><label>Nombre del sistema</label><input class="input" th:field="*{systemName}"></div><div class="field"><label>Versión</label><input class="input" th:field="*{version}"></div></div><div class="form-actions"><button class="btn btn-primary">💾 Guardar cambios</button></div></form></div></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
