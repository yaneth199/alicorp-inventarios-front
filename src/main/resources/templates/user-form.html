<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Usuario</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('users')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Usuario')}"></header><div class="content"><div class="card form-card"><div class="card-head"><h2>Datos de usuario</h2></div><div class="card-body"><form th:action="@{/users/save}" th:object="${appUser}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="field"><label>Nombre completo</label><input class="input" th:field="*{fullName}" required></div><div class="field"><label>Usuario</label><input class="input" th:field="*{username}" required></div><div class="field"><label>Correo</label><input class="input" type="email" th:field="*{email}" required></div><div class="field"><label>Contraseña</label><input class="input" type="password" th:field="*{password}" th:placeholder="${appUser.id==null?'Obligatoria':'Dejar vacío para conservar'}"></div><div class="field"><label>Rol</label><select class="select" th:field="*{role}"><option>Administrador</option><option>Ventas</option><option>Almacén</option><option>Supervisor</option></select></div><div class="field"><label>Estado</label><select class="select" th:field="*{active}"><option value="true">Activo</option><option value="false">Inactivo</option></select></div></div><div class="form-actions"><a class="btn" th:href="@{/users}">Cancelar</a><button class="btn btn-primary">Guardar usuario</button></div></form></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
