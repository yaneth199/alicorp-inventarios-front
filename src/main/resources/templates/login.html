<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Iniciar sesión</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="login-page">
  <div>
    <div class="login-card">
      <div class="login-logo"><div class="brand-mark">S</div><h1>SIGPI</h1><p>Sistema Integrado de Gestión de<br>Pedidos e Inventarios</p></div>
      <div class="alert error" th:if="${error}" th:text="${error}"></div>
      <div class="alert success" th:if="${param.logout}">Sesión cerrada correctamente.</div>
      <form th:action="@{/login}" method="post">
        <div class="field"><label>Usuario o correo electrónico</label><input class="input" name="username" th:value="${username}" placeholder="usuario@alicorp.pe" required autofocus></div>
        <div class="field"><label>Contraseña</label><div class="password-wrap"><input class="input" id="password" name="password" type="password" placeholder="••••••••" required><button type="button" class="eye" data-toggle-password>👁</button></div></div>
        <div class="login-meta"><label><input type="checkbox"> Recordarme</label><button class="btn-link" type="button" onclick="forgotPassword()">¿Olvidaste tu contraseña?</button></div>
        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
      </form>
      <p class="demo-cred">Credenciales de prueba: <b>admin / admin123</b></p>
    </div>
    <div class="login-footer">Alicorp S.A.C. — Arequipa, Perú © 2026</div>
  </div>
<script th:src="@{/js/app.js}"></script></body></html>
