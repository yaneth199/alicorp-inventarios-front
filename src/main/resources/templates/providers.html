<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Proveedores</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('providers')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Proveedores')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="toolbar"><form class="filters" method="get"><input class="input search" name="q" th:value="${q}" placeholder="Buscar proveedor..."><button class="btn">Buscar</button></form><div class="actions"><a class="btn" th:href="@{/providers/export}">📤 Exportar</a><a class="btn btn-primary" th:href="@{/providers/new}">+ Nuevo Proveedor</a></div></div><div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Código</th><th>RUC</th><th>Razón social</th><th>Contacto</th><th>Teléfono</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="p:${providers}"><td class="code" th:text="${p.code}"></td><td th:text="${p.ruc}"></td><td><b th:text="${p.businessName}"></b></td><td th:text="${p.contact}"></td><td th:text="${p.phone}"></td><td th:text="${p.email}"></td><td><span class="badge" th:classappend="${p.active}?'green':'gray'" th:text="${p.active?'Activo':'Inactivo'}"></span></td><td><div class="actions"><a class="btn btn-success btn-sm" th:href="@{'/providers/'+${p.id}+'/edit'}">Ver</a><a class="btn btn-blue btn-sm" th:href="@{'/providers/'+${p.id}+'/edit'}">Editar</a><form th:action="@{'/providers/'+${p.id}+'/toggle'}" method="post"><button class="btn btn-danger btn-sm" th:text="${p.active?'Desact.':'Activar'}"></button></form></div></td></tr></tbody></table></div><div class="table-foot"><span th:text="${providers.size()}+' proveedores registrados'"></span></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
