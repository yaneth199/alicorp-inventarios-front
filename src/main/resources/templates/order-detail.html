<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Detalle pedido</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('orders')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Detalle del Pedido')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="card form-card"><div class="card-head"><div><h2 th:text="${order.code}"></h2><small class="muted" th:text="${order.client.name+' · '+order.orderDate}"></small></div><span class="badge" th:classappend="${order.status=='Entregado'}?'green':(${order.status=='Cancelado'}?'red':(${order.status=='Pendiente'}?'yellow':'blue'))" th:text="${order.status}"></span></div><div class="card-body">
<div class="form-grid"><div class="field"><label>Cliente</label><div th:text="${order.client.name}"></div></div><div class="field"><label>Responsable</label><div th:text="${order.responsible}"></div></div></div>
<div class="status-flow"><div class="status-node" th:each="state:${#strings.arraySplit('Pendiente,En proceso,Preparado,Enviado,Entregado', ',')}" th:classappend="${order.status==state}?'current'"><div class="status-circle" th:text="${order.status==state?'●':'○'}"></div><span th:text="${state}"></span></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody><tr th:each="i:${order.items}"><td th:text="${i.product.name}"></td><td th:text="${i.quantity}"></td><td th:text="'S/ '+${#numbers.formatDecimal(i.price,1,2)}"></td><td class="money" th:text="'S/ '+${#numbers.formatDecimal(i.subtotal,1,2)}"></td></tr></tbody></table></div><div class="summary-box" style="margin-top:16px"><div class="summary-row total"><span>Total</span><b th:text="'S/ '+${#numbers.formatDecimal(order.total,1,2)}"></b></div></div>
<form class="form-actions" th:if="${canAdvanceOrders and !#lists.isEmpty(nextStates)}" th:action="@{'/orders/'+${order.id}+'/status'}" method="post"><input type="hidden" name="_csrf" th:value="${session.csrf}"><select class="select" name="status"><option th:each="s:${nextStates}" th:text="${s}" th:value="${s}"></option></select><button class="btn btn-primary">Cambiar estado</button></form>
<div class="form-actions"><a class="btn" th:href="@{'/orders/'+${order.id}+'/export/pdf'}">📄 Descargar PDF</a><a class="btn" th:href="@{'/orders/'+${order.id}+'/export/xlsx'}">📊 Excel</a><button class="btn" type="button" onclick="window.print()">🖨 Imprimir</button><a class="btn" th:href="@{/orders}">Volver</a></div>
<div class="state-log"><h3>Historial de estados</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha y hora</th><th>Estado</th><th>Responsable</th><th>Detalle</th></tr></thead><tbody><tr th:each="h:${order.history}"><td th:text="${#temporals.format(h.changedAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${h.status}"></td><td th:text="${h.responsible}"></td><td class="wrap" th:text="${h.note}"></td></tr></tbody></table></div></div></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
