<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Detalle pedido</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('orders')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Detalle del Pedido')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="card form-card"><div class="card-head"><div><h2 th:text="${order.code}"></h2><small class="muted" th:text="${order.client.name+' · '+order.orderDate}"></small></div><span class="badge" th:classappend="${order.status=='Entregado'}?'green':(${order.status=='Cancelado'}?'red':(${order.status=='Pendiente'}?'yellow':'blue'))" th:text="${order.status}"></span></div><div class="card-body">
<div class="form-grid"><div class="field"><label>Cliente</label><div th:text="${order.client.name}"></div></div><div class="field"><label>Responsable</label><div th:text="${order.responsible}"></div></div></div>
<div class="status-flow"><div class="status-node done"><div class="status-circle">✓</div><span>Registrado</span></div><div class="status-node" th:classappend="${order.status!='Pendiente' and order.status!='Cancelado'}?'done'"><div class="status-circle">2</div><span>En proceso</span></div><div class="status-node" th:classappend="${order.status=='Preparado' or order.status=='Entregado'}?'done'"><div class="status-circle">3</div><span>Preparado</span></div><div class="status-node" th:classappend="${order.status=='Entregado'}?'done'"><div class="status-circle">4</div><span>Entregado</span></div></div>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody><tr th:each="i:${order.items}"><td th:text="${i.product.name}"></td><td th:text="${i.quantity}"></td><td th:text="'S/ '+${#numbers.formatDecimal(i.price,1,2)}"></td><td class="money" th:text="'S/ '+${#numbers.formatDecimal(i.subtotal,1,2)}"></td></tr></tbody></table></div><div class="summary-box" style="margin-top:16px"><div class="summary-row total"><span>Total</span><b th:text="'S/ '+${#numbers.formatDecimal(order.total,1,2)}"></b></div></div>
<form class="form-actions" th:action="@{'/orders/'+${order.id}+'/status'}" method="post"><select class="select" name="status"><option>Pendiente</option><option>En proceso</option><option>Preparado</option><option>Entregado</option><option>Cancelado</option></select><button class="btn btn-primary">Cambiar estado</button><button class="btn" type="button" onclick="window.print()">🖨 Imprimir / PDF</button><a class="btn" th:href="@{/orders}">Volver</a></form></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
