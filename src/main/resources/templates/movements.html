<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Movimientos</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('movements')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Movimientos de Inventario')}"></header><div class="content"><div class="toolbar"><form class="filters" method="get"><input class="input search" placeholder="Buscar producto..."><select class="select"><option>Todos los tipos</option></select><input class="input" type="date" name="from" th:value="${from}"><input class="input" type="date" name="to" th:value="${to}"><button class="btn">Filtrar</button></form><div class="actions"><a class="btn" th:href="@{/movements/export}">📊 Exportar Excel</a><button class="btn" onclick="window.print()">📄 Exportar PDF</button></div></div><section class="kpi-grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="label">Total movimientos</div><div class="value" th:text="${movements.size()}"></div></div><div class="kpi green"><div class="label">Entradas registradas</div><div class="value" th:text="${entries}"></div></div><div class="kpi red"><div class="label">Salidas registradas</div><div class="value" th:text="${exits}"></div></div></section><div class="card"><div class="card-head"><h2>Kardex — Historial de Movimientos</h2><small class="muted" th:text="'Período: '+${from}+' al '+${to}"></small></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Código</th><th>Producto</th><th>Tipo</th><th>Entrada</th><th>Salida</th><th>Stock</th><th>Documento</th><th>Responsable</th></tr></thead><tbody><tr th:each="m:${movements}"><td th:text="${m.date}"></td><td class="code" th:text="${m.product.code}"></td><td><b th:text="${m.product.name}"></b></td><td><span class="badge" th:classappend="${m.type=='ENTRADA'}?'green':(${m.type=='SALIDA'}?'red':'blue')" th:text="${m.type}"></span></td><td style="color:#0a9a4d;font-weight:700" th:text="${m.type=='ENTRADA'?'+'+m.quantity:(m.type=='AJUSTE'?'+'+m.quantity:'—')}"></td><td style="color:#e22b3d;font-weight:700" th:text="${m.type=='SALIDA'?'-'+m.quantity:'—'}"></td><td class="money" th:text="${m.resultingStock}"></td><td th:text="${m.document}"></td><td th:text="${m.responsible}"></td></tr></tbody></table></div><div class="table-foot"><span th:text="${movements.size()}+' movimientos registrados en el período'"></span></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
