<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Catálogo</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('catalog')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Catálogo')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="card card-body"><p>Selecciona productos y confirma el pedido para un cliente. Precios de demostración en soles.</p><form method="get" th:action="@{/catalog}" class="filters"><input class="input" name="q" th:value="${q}" placeholder="Buscar producto o código"><button class="btn">Buscar</button><a class="btn btn-primary" th:href="@{/cart}" th:if="${canSell}">Ver carrito</a></form></div><div class="catalog-grid"><article class="card" th:each="p:${products}"><div class="product-symbol">📦</div><div class="card-body"><small class="code" th:text="${p.code}"></small><h2 th:text="${p.name}"></h2><p class="muted" th:text="${p.category.name+' · '+p.unit}"></p><h2 th:text="${'S/ '+#numbers.formatDecimal(p.salePrice,1,2)}"></h2><p th:text="${'Disponible: '+p.stock}"></p><form th:action="@{/cart/add}" method="post" th:if="${canSell}"><input type="hidden" name="_csrf" th:value="${session.csrf}"><input type="hidden" name="productId" th:value="${p.id}"><input class="input" style="width:90px" type="number" name="quantity" min="1" th:max="${p.stock}" value="1" required><button class="btn btn-primary" th:disabled="${p.stock==0}">Agregar</button></form></div></article></div><p th:if="${#lists.isEmpty(products)}">No hay productos para esta búsqueda.</p></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
