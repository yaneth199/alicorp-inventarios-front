<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Nuevo pedido</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('orders')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Nuevo Pedido')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><form th:action="@{/orders/save}" method="post">
<div class="card form-card"><div class="card-head"><h2>Datos del pedido</h2></div><div class="card-body"><div class="form-grid"><div class="field"><label>Cliente</label><select class="select" name="clientId" required><option value="">Seleccione cliente...</option><option th:each="c:${clients}" th:value="${c.id}" th:text="${c.documentNumber+' — '+c.name}"></option></select></div><div class="field"><label>Fecha</label><input class="input" value="27/08/2026" readonly></div></div></div></div>
<div class="card form-card"><div class="card-head"><h2>Productos del pedido</h2><button class="btn btn-primary btn-sm" type="button" onclick="addOrderLine()">+ Agregar producto</button></div><div class="card-body"><div id="order-lines" class="order-lines"><div class="line"><div class="field"><label>Producto</label><select class="select" name="productIds" onchange="recalcOrder()" required><option value="">Seleccione...</option><option th:each="p:${products}" th:value="${p.id}" th:attr="data-price=${p.salePrice},data-stock=${p.stock}" th:text="${p.code+' — '+p.name}"></option></select></div><div class="field"><label>Cantidad</label><input class="input" type="number" min="1" value="1" name="quantities" oninput="recalcOrder()" required></div><div class="price muted">S/ 0.00</div><button class="btn btn-danger remove" type="button" onclick="removeOrderLine(this)">×</button></div></div>
<template id="order-line-template"><div class="line"><div class="field"><label>Producto</label><select class="select" name="productIds" onchange="recalcOrder()" required><option value="">Seleccione...</option><option th:each="p:${products}" th:value="${p.id}" th:attr="data-price=${p.salePrice},data-stock=${p.stock}" th:text="${p.code+' — '+p.name}"></option></select></div><div class="field"><label>Cantidad</label><input class="input" type="number" min="1" value="1" name="quantities" oninput="recalcOrder()" required></div><div class="price muted">S/ 0.00</div><button class="btn btn-danger remove" type="button" onclick="removeOrderLine(this)">×</button></div></template>
<div class="summary-box"><div class="summary-row"><span>Subtotal</span><b id="orderSubtotal">S/ 0.00</b></div><div class="summary-row"><span>IGV incluido</span><b id="orderIgv">S/ 0.00</b></div><div class="summary-row total"><span>Total</span><b id="orderTotal">S/ 0.00</b></div></div><div class="form-actions"><a class="btn" th:href="@{/orders}">Cancelar</a><button class="btn" type="button" onclick="alert('Borrador guardado de forma visual para el prototipo.')">Guardar borrador</button><button class="btn btn-primary" type="submit">Registrar pedido</button></div></div></div></form></div></main></div><script th:src="@{/js/app.js}"></script><script>document.addEventListener('DOMContentLoaded',recalcOrder);</script></body></html>
