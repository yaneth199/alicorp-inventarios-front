<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
  <div class="brand">
    <div class="brand-mark">S</div>
    <div><strong>SIGPI</strong><small>GESTIÓN DE PEDIDOS</small></div>
  </div>
  <nav class="nav">
    <a th:href="@{/dashboard}" th:classappend="${active=='dashboard'}?'active'"><span class="ico">⊞</span> Dashboard</a>
    <a th:href="@{/products}" th:classappend="${active=='products'}?'active'"><span class="ico">📦</span> Productos</a>
    <a th:href="@{/categories}" th:classappend="${active=='categories'}?'active'"><span class="ico">🏷</span> Categorías</a>
    <a th:href="@{/inventory}" th:classappend="${active=='inventory'}?'active'"><span class="ico">▣</span> Inventario</a>
    <a th:href="@{/orders}" th:classappend="${active=='orders'}?'active'"><span class="ico">🛒</span> Pedidos</a>
    <a th:if="${session.user.role=='Administrador' or session.user.role=='Ventas' or session.user.role=='Supervisor'}" th:href="@{/clients}" th:classappend="${active=='clients'}?'active'"><span class="ico">👥</span> Clientes</a>
    <a th:if="${session.user.role=='Administrador' or session.user.role=='Almacén' or session.user.role=='Supervisor'}" th:href="@{/providers}" th:classappend="${active=='providers'}?'active'"><span class="ico">🏭</span> Proveedores</a>
    <a th:if="${session.user.role=='Administrador' or session.user.role=='Almacén' or session.user.role=='Supervisor'}" th:href="@{/movements}" th:classappend="${active=='movements'}?'active'"><span class="ico">↔</span> Movimientos</a>
    <a th:if="${session.user.role=='Administrador' or session.user.role=='Supervisor'}" th:href="@{/reports}" th:classappend="${active=='reports'}?'active'"><span class="ico">📊</span> Reportes</a>
    <a th:if="${session.user.role=='Administrador'}" th:href="@{/users}" th:classappend="${active=='users'}?'active'"><span class="ico">♟</span> Usuarios</a>
    <a th:if="${session.user.role=='Administrador'}" th:href="@{/settings}" th:classappend="${active=='settings'}?'active'"><span class="ico">⚙</span> Configuración</a>
  </nav>
  <div class="sidebar-bottom">
    <a th:href="@{/profile}"><span>♟</span> Mi Perfil</a>
    <form th:action="@{/logout}" method="post"><input type="hidden" name="_csrf" th:value="${session.csrf}"><button class="logout nav-logout">⊗ Cerrar sesión</button></form>
  </div>
</aside>

<header class="topbar" th:fragment="topbar(title)">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="icon-btn mobile-menu" data-menu>☰</button>
    <div class="page-title"><h1 th:text="${title}">Dashboard</h1><small th:text="${companyLabel}">Alicorp S.A.C. — Arequipa</small></div>
  </div>
  <div class="userbar">
    <a class="icon-btn" th:href="@{/inventory(status='Alerta')}" title="Consultar alertas de stock">🔔<span class="notif-dot" th:if="${stockAlertCount>0}"></span></a>
    <a class="user-pill" th:href="@{/profile}" title="Mi perfil">
      <div class="avatar" th:text="${session.user != null ? session.user.initials : 'U'}">JQ</div>
      <div class="user-text"><strong th:text="${session.user != null ? session.user.fullName : 'Usuario'}">Juan Quispe</strong><small th:text="${session.user != null ? session.user.role : 'Administrador'}">Administrador</small></div><span class="muted">▼</span>
    </a>
  </div>
</header>

<div th:fragment="flash">
  <div class="alert success" th:if="${success}" th:text="${success}"></div>
  <div class="alert error" th:if="${error}" th:text="${error}"></div>
</div>

<footer class="footer-mini" th:fragment="footer">SIGPI v1.0 · Alicorp S.A.C. — Arequipa, Perú © 2026</footer>
<script th:fragment="scripts" th:src="@{/js/app.js}"></script>
</body>
</html>
