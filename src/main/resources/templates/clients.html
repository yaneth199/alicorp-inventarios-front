<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Clientes</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('clients')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Clientes')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="toolbar"><form class="filters" method="get"><input class="input search" name="q" th:value="${q}" placeholder="Buscar por nombre o documento..."><button class="btn">Buscar</button></form><div class="actions"><a class="btn" th:href="@{/clients/export.xlsx(q=${q})}">📊 Excel</a><a class="btn" th:href="@{/clients/export.pdf(q=${q})}">📄 PDF</a><a class="btn btn-primary" th:href="@{/clients/new}" th:if="${canSell}">+ Nuevo Cliente</a></div></div><div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Código</th><th>RUC/DNI</th><th>Razón social / Nombre</th><th>Dirección</th><th>Teléfono</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="c:${clients}"><td class="code" th:text="${c.code}"></td><td th:text="${c.documentNumber}"></td><td><b th:text="${c.name}"></b></td><td th:text="${c.address}"></td><td th:text="${c.phone}"></td><td th:text="${#strings.isEmpty(c.email)?'—':c.email}"></td><td><span class="badge" th:classappend="${c.active}?'green':'gray'" th:text="${c.active?'Activo':'Inactivo'}"></span></td><td><div class="actions"><a class="btn btn-success btn-sm" th:href="@{'/clients/'+${c.id}+'/edit'}" th:if="${canSell}">Ver</a><a class="btn btn-blue btn-sm" th:href="@{'/clients/'+${c.id}+'/edit'}" th:if="${canSell}">Editar</a></div></td></tr></tbody></table></div><div class="table-foot"><span th:text="${tableLabel}"></span><div class="pagination" th:if="${pageCount>1}"><a th:each="link:${pageLinks}" th:href="${link.url}" th:classappend="${link.current}?'active'" th:text="${link.number}"></a></div></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
