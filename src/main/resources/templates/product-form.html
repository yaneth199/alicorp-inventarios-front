<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Producto</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('products')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Producto')}"></header><div class="content"><div class="card form-card"><div class="card-head"><h2 th:text="${product.id==null?'Registrar nuevo producto':'Editar producto'}"></h2></div><div class="card-body"><form th:action="@{/products/save}" method="post"><input type="hidden" name="id" th:value="${product.id}"><div class="form-grid">
<div class="field"><label>Código</label><input class="input" name="code" th:value="${product.code}" placeholder="PRD-009" required></div><div class="field"><label>Nombre</label><input class="input" name="name" th:value="${product.name}" required></div>
<div class="field"><label>Categoría</label><select class="select" name="categoryId" required><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category!=null and product.category.id==c.id}"></option></select></div><div class="field"><label>Unidad de medida</label><input class="input" name="unit" th:value="${product.unit}" placeholder="Unidad" required></div>
<div class="field"><label>Precio de compra</label><input class="input" type="number" step="0.01" min="0" name="purchasePrice" th:value="${product.purchasePrice}" required></div><div class="field"><label>Precio de venta</label><input class="input" type="number" step="0.01" min="0" name="salePrice" th:value="${product.salePrice}" required></div>
<div class="field"><label>Stock actual</label><input class="input" type="number" min="0" name="stock" th:value="${product.stock}" required></div><div class="field"><label>Stock mínimo</label><input class="input" type="number" min="0" name="minStock" th:value="${product.minStock}" required></div>
<div class="field full"><label>Descripción</label><textarea class="textarea" name="description" th:text="${product.description}"></textarea></div><div class="field"><label>Estado</label><select class="select" name="active"><option value="true" th:selected="${product.active}">Activo</option><option value="false" th:selected="${!product.active}">Inactivo</option></select></div></div><div class="form-actions"><a class="btn" th:href="@{/products}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar producto</button></div></form></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
