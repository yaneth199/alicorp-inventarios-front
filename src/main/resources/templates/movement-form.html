<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Movimiento</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('inventory')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Movimiento de Inventario')}"></header><div class="content"><div class="card form-card"><div class="card-head"><h2 th:text="${type=='ENTRADA'?'Registrar entrada de inventario':'Registrar salida de inventario'}"></h2></div><div class="card-body"><form th:action="@{/inventory/movement}" method="post"><input type="hidden" name="type" th:value="${type}"><div class="form-grid"><div class="field full"><label>Producto</label><select class="select" name="productId" required><option value="">Seleccione un producto...</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.code+' — '+p.name+' (Stock: '+p.stock+')'}"></option></select></div><div class="field"><label>Cantidad</label><input class="input" name="quantity" type="number" min="1" required></div><div class="field"><label>N.º documento</label><input class="input" name="document" placeholder="GR-0893 / PED-2026-009"></div><div class="field full"><label>Motivo / observaciones</label><textarea class="textarea" name="note"></textarea></div></div><div class="form-actions"><a class="btn" th:href="@{/inventory}">Cancelar</a><button class="btn btn-primary" th:text="${type=='ENTRADA'?'Registrar entrada':'Registrar salida'}"></button></div></form></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
