<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Reportes</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('reports')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Reportes')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="report-layout"><div class="card report-menu"><h3>TIPO DE REPORTE</h3><a th:each="t:${reportTypes}" th:href="@{/reports(type=${t.key},from=${from},to=${to},clientId=${clientId},productId=${productId},categoryId=${categoryId},status=${status})}" th:classappend="${type==t.key}?'active'" th:text="${t.value}"></a></div><div>
<div class="card"><div class="card-body"><b th:text="${table.title}"></b><form class="filters" method="get" th:action="@{/reports}" style="margin-top:12px"><input type="hidden" name="type" th:value="${type}">
<div class="field"><label>Desde</label><input class="input" type="date" name="from" th:value="${from}" th:disabled="${type=='inventory' or type=='low' or type=='out'}"></div><div class="field"><label>Hasta</label><input class="input" type="date" name="to" th:value="${to}" th:disabled="${type=='inventory' or type=='low' or type=='out'}"></div>
<div class="field"><label>Producto</label><select class="select" name="productId"><option value="">Todos los productos</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.name}" th:selected="${productId==p.id}"></option></select></div>
<div class="field"><label>Categoría</label><select class="select" name="categoryId"><option value="">Todas</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId==c.id}"></option></select></div>
<div class="field" th:if="${type=='orders' or type=='clients' or type=='states' or type=='top'}"><label>Cliente</label><select class="select" name="clientId"><option value="">Todos los clientes</option><option th:each="c:${clients}" th:value="${c.id}" th:text="${c.name}" th:selected="${clientId==c.id}"></option></select></div>
<div class="field" th:if="${type=='orders' or type=='clients' or type=='states' or type=='top'}"><label>Estado</label><select class="select" name="status"><option value="">Todos</option><option th:each="s:${#strings.arraySplit('Pendiente,En proceso,Preparado,Enviado,Entregado,Cancelado', ',')}" th:text="${s}" th:selected="${status==s}" th:value="${s}"></option></select></div>
<button class="btn btn-primary" style="margin-top:19px">📊 Generar Reporte</button><a class="btn" style="margin-top:19px" th:href="@{/reports/export/xlsx(type=${type},from=${from},to=${to},clientId=${clientId},productId=${productId},categoryId=${categoryId},status=${status})}">📊 Excel</a><a class="btn" style="margin-top:19px" th:href="@{/reports/export/pdf(type=${type},from=${from},to=${to},clientId=${clientId},productId=${productId},categoryId=${categoryId},status=${status})}">📄 PDF</a><button class="btn" type="button" style="margin-top:19px" onclick="window.print()">🖨 Imprimir</button></form></div></div>
<div class="card" th:if="${type=='orders' or type=='clients' or type=='states' or type=='top'}"><div class="card-head"><h2>Pedidos Registrados por Mes</h2></div><div class="bar-chart"><div class="bar-col" th:each="n,st:${ordersByMonth}"><b th:text="${n}"></b><div class="bar" th:style="'height:'+${n*140.0/maxMonth}+'px'"></div><span class="bar-label" th:text="${months[st.index]}"></span></div></div></div>
<div class="card" th:if="${type=='orders' or type=='clients' or type=='states' or type=='top'}"><div class="card-head"><h2>Importe de pedidos no cancelados por mes (S/)</h2></div><div class="line-chart"><svg viewBox="0 0 800 160" preserveAspectRatio="none"><polyline th:attr="points=${linePoints}"></polyline></svg><div class="chart-labels"><span th:each="m:${months}" th:text="${m}"></span></div></div></div>
<div class="card"><div class="card-head"><h2 th:text="${table.title}"></h2><small th:text="${table.summary}"></small></div><div class="table-wrap"><table class="data-table"><thead><tr><th th:each="h:${table.headers}" th:text="${h}"></th></tr></thead><tbody><tr th:each="row:${table.rows}"><td class="wrap" th:each="cell:${row}" th:text="${cell}"></td></tr><tr th:if="${#lists.isEmpty(table.rows)}"><td th:colspan="${table.headers.size()}" class="empty">No hay registros con estos filtros.</td></tr></tbody></table></div></div></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
