<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Productos</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('products')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Productos')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div>
<div class="toolbar"><form class="filters" method="get" th:action="@{/products}"><input class="input search" name="q" th:value="${q}" placeholder="Buscar por código o nombre..."><select class="select" name="categoryId"><option value="">Todas las categorías</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId==c.id}"></option></select><select class="select" name="status"><option value="">Todos los estados</option><option value="Disponible" th:selected="${status=='Disponible'}">Disponible</option><option value="Stock bajo" th:selected="${status=='Stock bajo'}">Stock bajo</option><option value="Agotado" th:selected="${status=='Agotado'}">Agotado</option></select><button class="btn" type="submit">Buscar</button></form><div class="actions"><a class="btn" th:href="@{/products/export}">📤 Exportar</a><a class="btn btn-primary" th:href="@{/products/new}">+ Nuevo Producto</a></div></div>
<section class="kpi-grid"><div class="kpi red"><div class="label">Total</div><div class="value" th:text="${total}"></div></div><div class="kpi green"><div class="label">Activos</div><div class="value" th:text="${activeCount}"></div></div><div class="kpi yellow"><div class="label">Stock bajo</div><div class="value" th:text="${lowCount}"></div></div><div class="kpi red"><div class="label">Agotados</div><div class="value" th:text="${outCount}"></div></div></section>
<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Código</th><th>Nombre del producto</th><th>Categoría</th><th>U.M.</th><th>P. compra</th><th>P. venta</th><th>Stock</th><th>Stock mín.</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="p:${products}"><td class="code" th:text="${p.code}"></td><td><b th:text="${p.name}"></b></td><td><span class="badge gray" th:text="${p.category.name}"></span></td><td th:text="${p.unit}"></td><td th:text="'S/ '+${#numbers.formatDecimal(p.purchasePrice,1,2)}"></td><td class="money" th:text="'S/ '+${#numbers.formatDecimal(p.salePrice,1,2)}"></td><td class="money" th:text="${p.stock}" th:style="${p.stock<=p.minStock}?'color:#dc6803':''"></td><td th:text="${p.minStock}"></td><td><span class="badge" th:classappend="${p.stockStatus=='Disponible'}?'green':(${p.stockStatus=='Agotado'}?'red':'yellow')" th:text="${p.stockStatus}"></span></td><td><div class="actions"><a class="btn btn-success btn-sm" th:href="@{'/products/'+${p.id}+'/edit'}">Ver</a><a class="btn btn-blue btn-sm" th:href="@{'/products/'+${p.id}+'/edit'}">Editar</a><form th:action="@{'/products/'+${p.id}+'/delete'}" method="post"><button class="btn btn-danger btn-sm" data-confirm="¿Eliminar este producto?" type="submit">Eliminar</button></form></div></td></tr></tbody></table></div><div class="table-foot"><span th:text="'Mostrando '+${products.size()}+' productos'"></span><div class="pagination"><span class="active">1</span><span>2</span><span>3</span></div></div></div>
<footer th:replace="~{fragments/layout :: footer}"></footer></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
