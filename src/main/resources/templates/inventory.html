<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Inventario</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('inventory')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Inventario')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="toolbar"><form class="filters" method="get"><input class="input search" name="q" th:value="${q}" placeholder="Buscar código o producto..."><select class="select" name="categoryId"><option value="">Todas las categorías</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId==c.id}"></option></select><select class="select" name="status"><option value="">Todos los estados</option><option value="Disponible" th:selected="${status=='Disponible'}">Disponible</option><option value="Stock bajo" th:selected="${status=='Stock bajo'}">Stock bajo</option><option value="Agotado" th:selected="${status=='Agotado'}">Agotado</option></select><button class="btn">Buscar</button></form><div class="actions"><a class="btn" th:href="@{/inventory/movement(type='SALIDA')}">📤 Registrar Salida</a><a class="btn btn-primary" th:href="@{/inventory/movement(type='ENTRADA')}">📥 Registrar Entrada</a><a class="btn" th:href="@{/products/export}">📊 Exportar</a></div></div>
<section class="kpi-grid"><div class="kpi"><div class="label">Total productos</div><div class="value" th:text="${products.size()}"></div></div><div class="kpi green"><div class="label">Disponibles</div><div class="value" th:text="${available}"></div></div><div class="kpi yellow"><div class="label">Stock bajo</div><div class="value" th:text="${low}"></div></div><div class="kpi red"><div class="label">Agotados</div><div class="value" th:text="${out}"></div></div></section>
<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>St. inicial</th><th>Entradas</th><th>Salidas</th><th>Stock actual</th><th>Stock mín.</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="p:${products}"><td class="code" th:text="${p.code}"></td><td><b th:text="${p.name}"></b></td><td><span class="badge gray" th:text="${p.category.name}"></span></td><td th:text="${p.stock}"></td><td style="color:#0a9a4d;font-weight:700">+ —</td><td style="color:#e22b3d;font-weight:700">− —</td><td class="money" th:text="${p.stock}"></td><td th:text="${p.minStock}"></td><td><span class="badge" th:classappend="${p.stockStatus=='Disponible'}?'green':(${p.stockStatus=='Agotado'}?'red':'yellow')" th:text="${p.stockStatus}"></span></td><td><a class="btn btn-success btn-sm" th:href="@{/movements}">Movimientos</a></td></tr></tbody></table></div><div class="table-foot"><span th:text="${products.size()}+' productos en inventario'"></span></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
