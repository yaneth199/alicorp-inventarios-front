<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Proveedor</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('providers')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Proveedor')}"></header><div class="content"><div class="card form-card"><div class="card-head"><h2>Datos del proveedor</h2></div><div class="card-body"><form th:action="@{/providers/save}" th:object="${provider}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="field"><label>Código</label><input class="input" th:field="*{code}" required></div><div class="field"><label>RUC</label><input class="input" th:field="*{ruc}" required></div><div class="field"><label>Razón social</label><input class="input" th:field="*{businessName}" required></div><div class="field"><label>Contacto</label><input class="input" th:field="*{contact}"></div><div class="field"><label>Teléfono</label><input class="input" th:field="*{phone}"></div><div class="field"><label>Correo</label><input class="input" type="email" th:field="*{email}"></div><div class="field"><label>Estado</label><select class="select" th:field="*{active}"><option value="true">Activo</option><option value="false">Inactivo</option></select></div></div><div class="form-actions"><a class="btn" th:href="@{/providers}">Cancelar</a><button class="btn btn-primary">Guardar proveedor</button></div></form></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
