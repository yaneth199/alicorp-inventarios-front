<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Categorías</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('categories')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Categorías')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="toolbar"><div class="filters"><input class="input search" placeholder="Buscar categoría..."></div><a class="btn btn-primary" th:href="@{/categories/new}">+ Nueva Categoría</a></div><div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Código</th><th>Categoría</th><th>Descripción</th><th>N.º Productos</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="c:${categories}"><td class="code" th:text="${c.code}"></td><td><b th:text="${c.name}"></b></td><td th:text="${c.description}"></td><td><span class="badge gray" th:text="${counts[c.id]}"></span></td><td><span class="badge" th:classappend="${c.active}?'green':'gray'" th:text="${c.active?'Activo':'Inactivo'}"></span></td><td><div class="actions"><a class="btn btn-blue btn-sm" th:href="@{'/categories/'+${c.id}+'/edit'}">Editar</a><form th:action="@{'/categories/'+${c.id}+'/toggle'}" method="post"><button class="btn btn-sm" th:classappend="${c.active}?'btn-danger':'btn-success'" th:text="${c.active?'Desactivar':'Activar'}"></button></form></div></td></tr></tbody></table></div><div class="table-foot"><span th:text="${categories.size()}+' categorías encontradas'"></span></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
