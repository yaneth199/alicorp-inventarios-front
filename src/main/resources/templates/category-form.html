<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Categoría</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('categories')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Categoría')}"></header><div class="content"><div class="card form-card"><div class="card-head"><h2>Datos de categoría</h2></div><div class="card-body"><form th:action="@{/categories/save}" th:object="${category}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="field"><label>Código</label><input class="input" th:field="*{code}" required></div><div class="field"><label>Nombre</label><input class="input" th:field="*{name}" required></div><div class="field full"><label>Descripción</label><textarea class="textarea" th:field="*{description}"></textarea></div><div class="field"><label>Estado</label><select class="select" th:field="*{active}"><option value="true">Activo</option><option value="false">Inactivo</option></select></div></div><div class="form-actions"><a class="btn" th:href="@{/categories}">Cancelar</a><button class="btn btn-primary">Guardar categoría</button></div></form></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
