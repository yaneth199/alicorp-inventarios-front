<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Pedidos</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('orders')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Pedidos')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div>
<div class="toolbar"><form class="filters" method="get"><input class="input search" name="q" th:value="${q}" placeholder="N.º pedido o cliente..."><input class="input" name="from" type="date" th:value="${from}"><input class="input" name="to" type="date" th:value="${to}"><select class="select" name="status"><option value="">Todos los estados</option><option>Pendiente</option><option>En proceso</option><option>Preparado</option><option>Entregado</option><option>Cancelado</option></select><button class="btn">Buscar</button></form><div class="actions"><a class="btn" th:href="@{/reports/orders.csv}">📤 Exportar</a><a class="btn btn-primary" th:href="@{/orders/new}">+ Nuevo Pedido</a></div></div>
<section class="kpi-grid" style="grid-template-columns:repeat(5,1fr)"><div class="kpi yellow"><div class="label">Pendiente</div><div class="value" th:text="${pending}"></div></div><div class="kpi"><div class="label">En proceso</div><div class="value" style="color:#2672e4" th:text="${processing}"></div></div><div class="kpi"><div class="label">Preparado</div><div class="value" style="color:#8247e5" th:text="${prepared}"></div></div><div class="kpi green"><div class="label">Entregado</div><div class="value" th:text="${delivered}"></div></div><div class="kpi red"><div class="label">Cancelado</div><div class="value" th:text="${cancelled}"></div></div></section>
<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>N.º Pedido</th><th>Cliente</th><th>Fecha</th><th>Productos</th><th>Total</th><th>Estado</th><th>Responsable</th><th>Acciones</th></tr></thead><tbody><tr th:each="o:${orders}"><td class="code" th:text="${o.code}"></td><td th:text="${o.client.name}"></td><td th:text="${o.orderDate}"></td><td th:text="${o.items.size()}+' ítems'"></td><td class="money" th:text="'S/ '+${#numbers.formatDecimal(o.total,1,2)}"></td><td><span class="badge" th:classappend="${o.status=='Entregado'}?'green':(${o.status=='Cancelado'}?'red':(${o.status=='Pendiente'}?'yellow':(${o.status=='Preparado'}?'purple':'blue')))" th:text="${o.status}"></span></td><td th:text="${o.responsible}"></td><td><div class="actions"><a class="btn btn-success btn-sm" th:href="@{'/orders/'+${o.id}}">Ver</a><a class="btn btn-blue btn-sm" th:href="@{'/orders/'+${o.id}}">Editar</a></div></td></tr></tbody></table></div><div class="table-foot"><span th:text="${orders.size()}+' pedidos encontrados'"></span><div class="pagination"><span class="active">1</span><span>2</span><span>3</span></div></div></div>
</div></main></div><script th:src="@{/js/app.js}"></script></body></html>
