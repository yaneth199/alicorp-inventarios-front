<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Cliente</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('clients')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Cliente')}"></header><div class="content"><div class="card form-card"><div class="card-head"><h2>Datos del cliente</h2></div><div class="card-body"><form th:action="@{/clients/save}" th:object="${client}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="field"><label>Código</label><input class="input" th:field="*{code}" placeholder="CLI-006" required></div><div class="field"><label>Tipo documento</label><select class="select" th:field="*{documentType}"><option>RUC</option><option>DNI</option></select></div><div class="field"><label>N.º documento</label><input class="input" th:field="*{documentNumber}" required></div><div class="field"><label>Razón social / Nombres</label><input class="input" th:field="*{name}" required></div><div class="field full"><label>Dirección</label><input class="input" th:field="*{address}"></div><div class="field"><label>Distrito</label><input class="input" th:field="*{district}"></div><div class="field"><label>Provincia</label><input class="input" th:field="*{province}"></div><div class="field"><label>Departamento</label><input class="input" th:field="*{department}"></div><div class="field"><label>Teléfono</label><input class="input" th:field="*{phone}"></div><div class="field"><label>Correo</label><input class="input" type="email" th:field="*{email}"></div><div class="field"><label>Estado</label><select class="select" th:field="*{active}"><option value="true">Activo</option><option value="false">Inactivo</option></select></div></div><div class="form-actions"><a class="btn" th:href="@{/clients}">Cancelar</a><button class="btn btn-primary">Guardar cliente</button></div></form></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
