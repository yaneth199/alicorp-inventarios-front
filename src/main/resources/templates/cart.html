<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Carrito</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('cart')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Carrito')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="card card-body"><p>El stock se confirma al registrar el pedido. El carrito se conserva durante esta sesión.</p><p th:if="${#lists.isEmpty(lines)}">Tu carrito está vacío.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Producto</th><th>Cantidad (0 para quitar)</th><th>Importe</th></tr></thead><tbody><tr th:each="line:${lines}"><td th:text="${line.product.name}"></td><td><form th:action="@{/cart/update}" method="post"><input type="hidden" name="_csrf" th:value="${session.csrf}"><input type="hidden" name="productId" th:value="${line.product.id}"><input class="input" style="width:100px" type="number" min="0" name="quantity" th:value="${line.quantity}" required><button class="btn">Actualizar</button></form></td><td th:text="${'S/ '+#numbers.formatDecimal(line.subtotal,1,2)}"></td></tr></tbody></table></div><h2 th:text="${'Total: S/ '+#numbers.formatDecimal(total,1,2)}"></h2><form th:if="${!#lists.isEmpty(lines)}" th:action="@{/cart/checkout}" method="post"><input type="hidden" name="_csrf" th:value="${session.csrf}"><label>Cliente</label><select class="select" name="clientId" required><option value="">Selecciona un cliente</option><option th:each="c:${clients}" th:value="${c.id}" th:text="${c.name}"></option></select><button class="btn btn-primary" style="margin-top:15px">Confirmar pedido</button></form><a class="btn" th:href="@{/catalog}">Seguir comprando</a></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
