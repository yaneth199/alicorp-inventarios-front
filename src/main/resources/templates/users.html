<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Usuarios</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('users')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Gestión de Usuarios')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="toolbar"><input class="input search" placeholder="Buscar usuario..."><a class="btn btn-primary" th:href="@{/users/new}">+ Nuevo Usuario</a></div><section class="kpi-grid"><div class="kpi"><span class="badge red">Administrador</span><div class="value" style="float:right" th:text="${counts.getOrDefault('Administrador',0L)}"></div><div class="sub">Acceso completo al sistema, Gestión de usuarios</div></div><div class="kpi"><span class="badge blue">Ventas</span><div class="value" style="float:right" th:text="${counts.getOrDefault('Ventas',0L)}"></div><div class="sub">Clientes, Pedidos</div></div><div class="kpi"><span class="badge yellow">Almacén</span><div class="value" style="float:right" th:text="${counts.getOrDefault('Almacén',0L)}"></div><div class="sub">Productos, Inventario</div></div><div class="kpi"><span class="badge purple">Supervisor</span><div class="value" style="float:right" th:text="${counts.getOrDefault('Supervisor',0L)}"></div><div class="sub">Consultas, Reportes</div></div></section><div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Nombre completo</th><th>Usuario</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Último acceso</th><th>Acciones</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="'#'+${u.id}"></td><td><div style="display:flex;align-items:center;gap:8px"><span class="avatar" th:text="${u.initials}"></span><b th:text="${u.fullName}"></b></div></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td><span class="badge" th:classappend="${u.role=='Administrador'}?'red':(${u.role=='Ventas'}?'blue':(${u.role=='Almacén'}?'yellow':'purple'))" th:text="${u.role}"></span></td><td><span class="badge" th:classappend="${u.active}?'green':'gray'" th:text="${u.active?'Activo':'Inactivo'}"></span></td><td th:text="${u.lastAccess}"></td><td><div class="actions"><a class="btn btn-blue btn-sm" th:href="@{'/users/'+${u.id}+'/edit'}">Editar</a><form th:action="@{'/users/'+${u.id}+'/delete'}" method="post"><button class="btn btn-danger btn-sm" data-confirm="¿Eliminar usuario?">Eliminar</button></form></div></td></tr></tbody></table></div><div class="table-foot"><span th:text="${users.size()}+' usuarios registrados'"></span></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
