<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGPI | Mi Perfil</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar('Mi Perfil')}"></header><div class="content"><div th:replace="~{fragments/layout :: flash}"></div><div class="card form-card"><div class="card-head"><h2>Información del usuario</h2></div><div class="card-body"><form th:action="@{/profile}" method="post"><div class="form-grid"><div class="field"><label>Nombre completo</label><input class="input" name="fullName" th:value="${profile.fullName}" required></div><div class="field"><label>Usuario</label><input class="input" th:value="${profile.username}" readonly></div><div class="field"><label>Correo</label><input class="input" name="email" type="email" th:value="${profile.email}" required></div><div class="field"><label>Rol</label><input class="input" th:value="${profile.role}" readonly></div><div class="field full"><label>Nueva contraseña (opcional)</label><input class="input" name="password" type="password" placeholder="Dejar vacío para mantener la actual"></div></div><div class="form-actions"><button class="btn btn-primary">Guardar cambios</button></div></form></div></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
