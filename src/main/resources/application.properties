spring.application.name=SIGPI
server.port=8080

# Base de datos H2 persistente en la raíz del proyecto.
# Evita fallos cuando no existe una carpeta /data en Windows/NetBeans.
spring.datasource.url=jdbc:h2:file:./sigpi_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Errores útiles durante desarrollo
server.error.include-message=always
