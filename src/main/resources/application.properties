spring.application.name=SIGPI
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigpi_alicorp}
spring.datasource.username=${DB_USER:sigpi}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.thymeleaf.cache=false
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
sigpi.demo=${SIGPI_DEMO:false}
sigpi.admin-password=${SIGPI_ADMIN_PASSWORD:}
